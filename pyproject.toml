[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmu-rag-corpus"
version = "0.1.0"
description = "Offline ingestion for Vietnamese education regulation RAG corpus"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
  "pytesseract>=0.3.10,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "reportlab>=4,<5"]
xls = ["xlrd>=2,<3"]

[project.scripts]
tmu-corpus = "tmu_corpus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
